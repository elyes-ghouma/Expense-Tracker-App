name: CI

# Run on every push to main and on every pull request that targets main.
# workflow_dispatch adds a "Run workflow" button in the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repository.
permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # Keeps Expo CLI quiet and non-interactive on CI.
  EXPO_NO_TELEMETRY: "1"
  CI: "true"

jobs:
  quality:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if any package version drifts from what Expo SDK 54 expects.
      - name: Check Expo dependency versions
        run: npx expo install --check

      # Checks app config, native module peers and SDK compatibility.
      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Non-blocking for now: 13 files are not Prettier-formatted yet. After
      # running `npx prettier --write .` once, remove continue-on-error.
      - name: Format check (Prettier)
        run: npx prettier --check "app/**/*.{ts,tsx}" "src/**/*.{ts,tsx}" "__tests__/**/*.{ts,tsx}"
        continue-on-error: true

      # Runs Jest with the coverage thresholds from jest.config.js.
      - name: Test with coverage
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    name: Export ${{ matrix.platform }} bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only bundle when the quick checks pass.
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Metro bundles the whole app, so broken imports, bad routes and
      # app.json/plugin errors fail here. No native build or EAS account needed.
      - name: Export JavaScript bundle
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist

  # ---- CD: build a new APK once every check above has passed ----
  build-apk:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, bundle]
    # Only for pushes to main: never for pull requests or manual runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Create at https://expo.dev/settings/access-tokens and save it under
      # GitHub repo Settings > Secrets and variables > Actions as EXPO_TOKEN.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check that the Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Starts the "preview" profile from eas.json (installable APK) on EAS
      # servers. EAS bumps versionCode automatically. --no-wait returns as soon
      # as the build is queued; the build link is printed in this step's log.
      - name: Start EAS build
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
